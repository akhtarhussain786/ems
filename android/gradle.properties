# Sized for the 8GB laptop this is built on. The previous -Xmx8G with a 4G
# metaspace promised Gradle 12GB on a machine with 7.4GB, so the kernel killed
# the build partway through (exit 143) rather than any step actually failing.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Kotlin compiles in its own daemon with its own heap; left unset it claims a
# share of its own on top of the above.
kotlin.daemon.jvmargs=-Xmx1024m

# One module at a time, and few workers. Slower, but it finishes.
org.gradle.parallel=false
org.gradle.workers.max=2

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable Kotlin incremental compilation on Windows to fix cache locking
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

