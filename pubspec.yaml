name: yatharthems_apps
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0
  camera: ^0.11.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  image_picker: ^1.1.0
  path_provider: ^2.1.0
  flutter_image_compress: ^2.3.0
  connectivity_plus: ^6.0.3
  google_fonts: ^6.3.2
  flutter_native_splash: ^2.4.0
  url_launcher: ^6.3.0
  pdf: ^3.10.4
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.1
  file_picker: ^8.1.7

  # In-app APK updates (distributed outside the Play Store)
  package_info_plus: ^8.0.2   # installed version, never hardcoded
  dio: ^5.7.0                 # download with progress + cancellation
  open_filex: ^4.5.0          # hands the APK to Android's package installer
  crypto: ^3.0.5
  device_info_plus: ^10.1.2   # stable per-device id, so an account binds to one handset              # SHA-256 verification of the downloaded file

  # Face verification at check-in. All three run on the device and cost nothing
  # to use: no per-call API, no subscription, nothing leaves the handset except
  # the resulting embedding.
  tflite_flutter: ^0.12.1              # runs the face model locally
  google_mlkit_face_detection: ^0.14.0 # finds and frames the face first
  image: ^4.8.0                        # crop and resize for the model




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo25.png
    # Face recognition model. Declared as a directory so the app still builds
    # when it is absent — face verification then reports itself unavailable
    # rather than the whole build failing.
    - assets/models/

# ✅ App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/logo2.png"
    background_color: "#1E3A5F"
    theme_color: "#1E3A5F"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

# ✅ Native Splash Configuration - CORRECTED (no extra indentation)
flutter_native_splash:
  color: "#1E3A5F"
  image: assets/images/logo.png
  android: true
  ios: true
  android_gravity: center
  android_screen_orientation: portrait
  ios_content_mode: center
  color_dark: "#1E3A5F"
  image_dark: assets/images/logo.png
